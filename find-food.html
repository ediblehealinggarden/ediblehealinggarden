<style>
/* Layout: scrolling story column beside a sticky hand-drawn county map; on phones the map pins to the top and the story scrolls beneath it */
:root{

  --bg:#F2F3F0; --panel:#FFFFFF; --ink:#26291E; --muted:#4A4D3E; --olive:#586335; --olive-deep:#434C27; --clay:#A9532F; --terracotta:#C76942;
  --sage:#E6EAD6; --sage2:#C8D2A2; --line:#D9DCCC;
  --water:#CEDBD3; --land:#ECEEE3; --land2:#F7F8F3; --road:#CBB894; --county:#A3B374; --label:#434C27; --halo:#F2F3F0;
  --c-pantry:#C0694A; --c-bank:#8A4B3A; --c-market:#B9871E; --c-garden:#586335; --c-fridge:#3F7F7B; --c-other:#5F7A86;
  --display:"Outfit","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Sorts Mill Goudy","Goudy Old Style",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:210px; --navh:0px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img,svg{max-width:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--olive)} a:hover{color:var(--clay)}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);margin-left:var(--side)}
.story{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:20px 40vh;border-right:1px solid var(--line);min-width:0}
.mapcol{position:sticky;top:0;height:100vh;height:100dvh;min-width:0;background:var(--water)}
svg#map{width:100%;height:100%;display:block;touch-action:manipulation;cursor:grab}
svg#map.grabbing{cursor:grabbing}
.zoom{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--olive);cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .14);display:grid;place-items:center;padding:0}
.zoom button:hover{color:var(--clay)}
.zoom svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgb(38 41 30 / .84);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center;z-index:2}
.zhint.off{opacity:0}
.lang{display:flex;gap:6px}
.chip{font:500 13px var(--body);border:1.5px solid var(--olive);background:transparent;color:var(--olive);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--olive);color:var(--bg)}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
h1{font:400 clamp(30px,3vw,40px)/1.08 var(--serif);text-transform:uppercase;letter-spacing:.05em;color:var(--olive);margin:22px 0 14px;text-wrap:balance}
h1 .accent{color:var(--terracotta)}
h2{font:700 32px/1.05 var(--display);color:var(--olive);margin:8px 0 12px;text-wrap:balance}
.lede{font-size:18px;max-width:38ch}
p{margin:0 0 12px;max-width:62ch}
.tips{list-style:none;padding:14px 16px;margin:18px 0;background:var(--sage);border-radius:16px;display:grid;gap:6px;font-size:15px}
.tips li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.tips li::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--clay);transform:rotate(45deg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:14px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--c)}
.dot.home{border-radius:2px;transform:rotate(45deg);background:var(--clay)}
.chapter{padding-block:56px 24px;min-height:62vh;border-top:1px solid var(--line);margin-top:28px;transition:opacity .3s}
.intro{padding-block:4px 10px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.counts .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px 4px 9px}
.counts .chip b{font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:9px 12px;border-radius:12px;cursor:pointer}
.row .dot{margin-top:6px}
.row:hover,.row[aria-current="true"]{background:var(--sage)}
.row:focus-visible{outline:3px solid var(--clay)}
.row b{display:block;font-weight:500;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.home-card{background:var(--sage);border-radius:18px;padding:18px;margin:16px 0}
.home-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.home-card dt{color:var(--muted)} .home-card dd{margin:0;overflow-wrap:anywhere}
.fine{font-size:13px;color:var(--muted)}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;margin-top:20px;border-bottom:1px solid var(--line)}
.sfield{display:flex;gap:8px;margin-top:8px}
#sq{flex:1;min-width:0;font:16px var(--body);padding:11px 18px;border:1.5px solid var(--olive);border-radius:999px;background:var(--panel);color:var(--ink)}
#sq::placeholder{color:var(--muted)}
.sfield .btn{border:0;cursor:pointer;font-size:15px}
#sres{max-height:min(58vh,560px);overflow:auto;overscroll-behavior:contain;padding-top:12px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shead h3{font:700 21px/1.15 var(--display);color:var(--olive);margin:0;text-wrap:balance}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.fchips .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px}
.snote{font-size:14px;color:var(--muted);margin:8px 0}
.linkbtn{all:unset;cursor:pointer;color:var(--olive);text-decoration:underline;font-size:14px}
.linkbtn:hover{color:var(--clay)} .linkbtn:focus-visible{outline:3px solid var(--clay)}
.srch{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:4 3}
.srchlbl{fill:var(--ink);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
/* ============ Site navigation (same as index.html) ============ */
.logo{display:block;background:url("images/logo.webp") center/contain no-repeat}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:30;display:flex;flex-direction:column;gap:36px;padding-top:28px;background:var(--bg);border-right:1px solid var(--line)}
.side .logo{width:120px;height:116px;margin-left:28px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nav a{display:block;padding:15px 32px;font:700 .75rem/1.6 var(--body);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--olive)}
.nav a:hover{background:var(--sage);color:var(--olive)}
.nav a[aria-current="page"]{width:150px;background:var(--olive);color:#fff}
@media (max-width:900px){
  .side{position:sticky;bottom:auto;width:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);background:rgba(242,243,240,.96)}
  .side .logo{flex:none;width:46px;height:42px;margin:0}
  .nav{min-width:0;overflow-x:auto}
  .nav ul{flex-direction:row;flex-wrap:nowrap;justify-content:flex-end;gap:0}
  .nav a{padding:13px 6px;font-size:.64rem;letter-spacing:.03em;border-radius:999px}
  .nav li:first-child{display:none}
  .nav a[aria-current="page"]{width:auto}
}
/* "Previous page" cue at the top: scrolling up from here returns to the Gallery */
.prev-page{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;padding:6px 0;font:700 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--olive)}
.prev-page:hover{color:var(--terracotta)}
.prev-page svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes nudgeUp{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:no-preference){.prev-page svg{animation:nudgeUp 1.8s ease-in-out infinite}}
/* ============ Page transition: this page dissolves out, the next fades in ============ */
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes pageOut{from{opacity:1}to{opacity:0}}
body{animation:pageIn .5s ease both}
body.leaving{animation:pageOut .4s ease forwards}
/* map */
.water{fill:var(--water)} .land{fill:var(--land);stroke:var(--county);stroke-width:1} .land2{fill:var(--land2);stroke:var(--county);stroke-width:.8}
.road{fill:none;stroke:var(--road);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.road.minor{stroke-width:1;opacity:.7}
.lbl{fill:var(--label);font-family:var(--body);font-weight:500;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.big{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lbl.sea{font-style:italic;fill:var(--muted);letter-spacing:.2em}
.pin{stroke:var(--panel);cursor:pointer;transition:opacity .35s}
.pin.dim{opacity:.22}
.pin.sel{stroke:var(--ink)}
.p-pantry{fill:var(--c-pantry)}.p-bank{fill:var(--c-bank)}.p-market{fill:var(--c-market)}.p-garden{fill:var(--c-garden)}.p-fridge{fill:var(--c-fridge)}.p-other{fill:var(--c-other)}
.homemark{fill:var(--clay);stroke:var(--panel)}
.homelbl{fill:var(--clay);font-family:var(--display);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.mapnote{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:10px;font-size:11px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:999px;opacity:.9}
.where{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:14px;font:700 19px/1.15 var(--display);color:var(--olive);background:var(--bg);padding:6px 14px;border-radius:999px;box-shadow:0 2px 10px rgb(0 0 0 / .12);max-width:calc(100% - 28px)}
/* detail: while a place is open, lift the map column (and its phone pop-up) above the sticky search bar and site menu */
.mapcol.sheet-open{z-index:40}
#detail{position:absolute;top:66px;right:calc(16px + env(safe-area-inset-right,0px));bottom:16px;width:min(400px,calc(100% - 32px));overflow:auto;background:var(--panel);color:var(--ink);border-radius:20px;box-shadow:0 10px 34px rgb(0 0 0 / .25);padding:20px 22px;z-index:3;overscroll-behavior:contain}
#detail h3{font:700 26px/1.1 var(--display);color:var(--olive);margin:6px 0 4px;text-wrap:balance}
#detail .x{float:right;margin-left:10px}
#detail .addr{color:var(--muted);font-size:15px;white-space:pre-line;margin:6px 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.btn{font:500 14px var(--body);text-decoration:none;border-radius:999px;padding:8px 14px;background:var(--olive);color:var(--bg);display:inline-block}
.btn.ghost{background:transparent;color:var(--olive);border:1.5px solid var(--olive)}
.btn:hover{color:var(--bg);background:var(--clay)} .btn.ghost:hover{color:var(--clay);border-color:var(--clay);background:transparent}
#detail dl{margin:8px 0 0}
#detail dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);margin-top:12px}
#detail dd{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere;font-size:15px}
#detail .mission{background:var(--sage);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:14px;white-space:pre-line}
@media (max-width:900px){
  :root{--navh:58px}
  .wrap{display:flex;flex-direction:column;margin-left:0}
  .mapcol{order:-1;top:var(--navh);height:42dvh;z-index:2;border-bottom:1px solid var(--line)}
  .story{border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 30vh}
  .where{font-size:18px;top:10px}
  #detail{position:fixed;top:auto;left:0;right:0;bottom:0;width:100%;max-height:68dvh;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));z-index:20}
  .chapter{min-height:0;padding-block:40px 16px}
  .search{top:calc(var(--navh) + 42dvh);margin-top:12px}
  #sres{max-height:calc(58dvh - var(--navh) - 170px)}
  #ftypes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  #ftypes .chip{flex:none}
  h1{margin-top:16px}
}
@media (prefers-reduced-motion:reduce){body,body.leaving{animation:none}}
@media (prefers-reduced-motion:no-preference){#detail:not([hidden]){animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(10px);opacity:0}}}
</style>

e cultures to share gardening practices. As stewards of Tongva land, we are an organic garden and use Indigenous techniques such as no till-gardening and crop rotation.","type":"Community Garden","hours":"Saturdays 10 a.m. to 12 p.m.\nWednesday 5 to 7 p.m. (During standard time: Wednesdays 4 - 5:30 p.m., November to March)","days":"Saturdays & Wednesdays","addr":"1177 N Madison Ave, Los Angeles, CA 90029","web":"https://www.easthollywoodcommunitygarden.info/","email":"ehcommunitygarden@gmail.com","phone":"(310) 562-7361","social":"@easthollywoodcommunitygarden","cost":"Free to volunteer.\nPlot Dues: $15/month, $45 per quarter on Jan. 1, April 1, July 1, and Oct. 1. Payment options: check, cash, or online. No refunds if your lease ends early. Talk to the Treasurer in advance to request financial hardship. Dues may increase to pay for water, communal supplies, maintenance, and other expenses.","waitlist":"Submit a plot application to the Volunteer Coordinator. Applicants must be 18 years or older. Plots are assigned based on the application date and the date the applicant volunteered for 1 hour.\nWaitlist applicants who volunteer 3 or more hours per quarter get priority.\nhttps://docs.google.com/forms/d/e/1FAIpQLSe0UBEdJRENmF7AHecSEjakal59n-XZCg6fRD6Hp5GmEn6rYg/viewform","lang":"","restrict":"Prior to submitting a plot application you musy volunteer for 1 hour and read the garden agreements.","bus":"","snap":"","signup":"No prior sign-up or garden experience needed.","other":"Visitors can harvest herbs, vegetables, berries, and fruit from our communal areas. Open to the public on Saturday morning and Wednesday evenings."},"es":{"name":"East Hollywood Community Garden","mission":"East Hollywood Community Garden es un lugar donde los miembros de la comunidad cultivan alimentos saludables y conocen a personas de diversas culturas para compartir prácticas de jardinería. Como guardianes de la tierra Tongva, somos un jardín orgánico y utilizamos técnicas indígenas como la jardinería sin labranza y la rotación de cultivos.","type":"Huerto Comunitario","hours":"Sábados 10 a.m. a 12 p.m.\n Miércoles 5 a 7 p.m. (En horario estándar: miércoles 4 - 5:30 p.m., de noviembre a marzo)","days":"Sábados y miércoles","addr":"1177 N Madison Ave, Los Angeles, CA 90029","web":"https://www.easthollywoodcommunitygarden.info/","email":"ehcommunitygarden@gmail.com","phone":"(310) 562-7361","social":"@easthollywoodcommunitygarden","cost":"Gratis para voluntarios.\n Cuotas de lote: $15/mes, $45 por trimestre el 1 de enero, 1 de abril, 1 de julio y 1 de octubre. Opciones de pago: cheque, efectivo o en línea. No hay reembolsos si su arrendamiento termina antes. Hable con el Tesorero con anticipación para solicitar dificultad financiera. Las cuotas pueden aumentar para pagar el agua, los suministros comunales, el mantenimiento y otros gastos.","waitlist":"Envíe una solicitud de lote al Coordinador de Voluntarios. Los solicitantes deben tener 18 años o más. Los lotes se asignan según la fecha de la solicitud y la fecha en que el solicitante hizo 1 hora de voluntariado.\n Los solicitantes en lista de espera que hacen voluntariado 3 o más horas por trimestre tienen prioridad.\n https://docs.google.com/forms/d/e/1FAIpQLSe0UBEdJRENmF7AHecSEjakal59n-XZCg6fRD6Hp5GmEn6rYg/viewform","lang":"","restrict":"Antes de enviar una solicitud de lote debe hacer 1 hora de voluntariado y leer los acuerdos del jardín.","bus":"","snap":"","signup":"No se necesita inscripción previa ni experiencia en jardinería.","other":"Los visitantes pueden cosechar hierbas, verduras, bayas y frutas de nuestras áreas comunales. Abierto al público los sábados por la mañana y los miércoles por la tarde."},"lat":34.0915,"lng":-118.293,"r":"hw"},{"id":138,"cat":"garden","geo":"1816 Blake Ave, Los Angeles, CA 90039","en":{"name":"Elysian Valley Community Garden","mission":"Elysian Valley Community Garden is a place where families grow fresh healthy food while connecting with nature and one another. O e of this community garden, its more than 200 plots tilled by immigrants from all over Mexico and Central America. They have planted foods from their hometowns — the leafy greens papalo and chipilin, the herb hierba mora — sharing them with each other until one person’s traditions become everyone’s.\nMany of the gardeners labored for decades on construction sites or in factories but never achieved the American dream of a house with a yard.\nThey come to this 11-block strip of land, framed by electricity towers at 109th Street, west of the Nickerson Gardens housing development, to feel the soil between their fingers, to watch the plants grow, to marvel at the orange butterflies, to remind themselves of home.","type":"Community Garden","hours":"","days":"","addr":"658 E. 111th Place, Los Angeles, CA 90059, United States","web":"https://www.lagardencouncil.org/stanford_avalon_community_garden","email":"admin@lacommunitygardens.org","phone":"","social":"","cost":"","waitlist":"","lang":"","restrict":"","bus":"","snap":"","signup":"","other":""},"es":{"name":"Stanford Avalon Community Garden","mission":"Un huerto comunitario en Watts brinda consuelo y productos frescos a inmigrantes\nEsa es la naturaleza de este huerto comunitario, con sus más de 200 lotes cultivados por inmigrantes de todo México y Centroamérica. Han sembrado alimentos de sus pueblos natales — las verduras de hoja papalo y chipilín, la hierba mora — compartiéndolos entre sí hasta que las tradiciones de una persona se convierten en las de todos.\nMuchos de los jardineros trabajaron durante décadas en sitios de construcción o en fábricas, pero nunca alcanzaron el sueño americano de una casa con jardín.\nVienen a esta franja de terreno de 11 cuadras, enmarcada por torres eléctricas en la calle 109, al oeste del complejo de viviendas Nickerson Gardens, para sentir la tierra entre sus dedos, ver crecer las plantas, maravillarse con las mariposas naranjas, y recordar su hogar.","type":"Huerto Comunitario","hours":"","days":"","addr":"658 E. 111th Place, Los Angeles, CA 90059, United States","web":"https://www.lagardencouncil.org/stanford_avalon_community_garden","email":"admin@lacommunitygardens.org","phone":"","social":"","cost":"","waitlist":"","lang":"","restrict":"","bus":"","snap":"","signup":"","other":""},"lat":33.9345,"lng":-118.265,"r":"south"},{"id":160,"cat":"garden","geo":"363 E. Villa Street, Pasadena, CA 91101, United States","en":{"name":"Villa Verde Community Garden","mission":"Villa Verde Community Garden was founded in Pasadena on the rooftop patio of Villa Parke Recreation Center. Beginning in 2014, the garden is volunteer-run and  community driven. This garden is a place where people can learn, work, explore, and enjoy the outdoors. It exemplifies community growth.","type":"Community Garden","hours":"","days":"","addr":"363 E. Villa Street, Pasadena, CA 91101, United States","web":"https://www.lagardencouncil.org/villa_verde_community_garden","email":"villaverdegarden@gmail.com","phone":"","social":"@villaverde_rooftopgarden\nhttps://www.facebook.com/villaparkegarden/","cost":"","waitlist":"","lang":"","restrict":"","bus":"","snap":"","signup":"","other":""},"es":{"name":"Villa Verde Community Garden","mission":"Villa Verde Community Garden fue fundado en Pasadena en el patio de la azotea del Villa Parke Recreation Center. Comenzando en 2014, el jardín es dirigido por voluntarios e impulsado por la comunidad. Este jardín es un lugar donde las personas pueden aprender, trabajar, explorar y disfrutar del aire libre. Ejemplifica el crecimiento comunitario.","type":"Huerto Comunitario","hours":"","days":"","addr":"363 E. Villa Street, Pasadena, CA 91101, United States","web":"https://www.lagardencouncil.org/villa_verde_community_garden","email":"villaverdegarden@gmail.com","phone":"","social":"@villaverde_rooftopgarden\n https://www.facebook.com/villaparkegarden/","cost":"","waitlist":"","lang":"","restrict":"","bus":"","snap":"","signup":"","other":""},   ch:{
   east:['Boyle Heights & East LA','Our tour starts at home. The Edible Healing Garden grows on the LA General Medical Center campus, and the hospital hosts a free food distribution for its patients on the second Friday of each month.','Nearby you will find farmers markets at White Memorial (Thursdays) and Cal State LA (Tuesdays) that accept EBT, community fridges on 1st Street and in El Sereno, and several church food banks in Boyle Heights.'],
   dtla:['Downtown, Westlake & Koreatown','The Dream Center brings a mobile food pantry to stops around Westlake, MacArthur Park and Chinatown on Tuesdays and Wednesdays. Just wait in line; no sign-up needed.','St. Francis Center serves families and seniors on set days (bring your pantry card). Little Tokyo’s Saturday farmers market accepts SNAP/EBT, and community fridges in Koreatown and Pico-Union are stocked by neighbors.'],
   nela:['Echo Park to Eagle Rock','Hillside neighborhoods with deep garden roots. Elysian Valley Community Garden welcomes drop-in volunteers, Glassell Park Community Garden shares food twice a month, and Milagro Allegro in Highland Park opens its gates for public events.','Seeds of Hope runs church pantries in Echo Park, Lincoln Heights and Eagle Rock, and the community fridges on York Blvd and Eagle Rock Blvd are open around the clock.'],
   hw:['Hollywood, Mid-City & the Westside','Hollywood Food Coalition serves a free evening meal every day of the week: on Hollywood Blvd Monday through Friday, and at Orange Dr. and Romaine St. on weekends.','At East Hollywood Community Garden, visitors can pick herbs, vegetables and fruit from the shared beds on Saturday mornings and Wednesday evenings. Seeds of Hope pantries meet in West Hollywood parks and in Santa Monica.'],
   south:['South LA, Watts & Compton','More places on this map than any other area. County health centers, including MLK Outpatient, Hubert H. Humphrey, H. Claude Hudson and Curtis R. Tucker, hold monthly food giveaways for their patients. Ask your care team about dates.','Watts is home to some of the county’s biggest community gardens. At Stanford Avalon, more than 200 plots are tended mostly by families from Mexico and Central America, growing the greens and herbs of home.'],
   harbor:['South Bay & the Harbor','Harbor-UCLA Medical Center holds a food distribution for patients on the first four Thursdays of each month. On Fridays, Let’s Be Whole brings a mobile pantry with fresh produce to the YWCA in San Pedro.','Gaffey Street Community Garden in San Pedro has been growing for more than 40 years, with plots for over 200 families.'],
   sgv:['San Gabriel Valley & Gateway Cities','From Pasadena to Pomona, and south to Whittier and Norwalk. Foothill Unity Center in Pasadena and Monrovia gives out groceries three mornings a week, delivers to people with disabilities, and even offers pet food.','Some pantries here ask for ID, proof of address or income, or a 211 referral before your first visit. Others, like the Alhambra Teachers Association, never ask for ID. Check each listing before you go.'],
   sfv:['The Valley & North County','At the Shift Our Ways gardens in Arleta and Reseda, anyone can harvest up to two pounds of free produce per visit, with no sign-up needed.','Olive View-UCLA in Sylmar holds patient food distributions on most Wednesdays, and North Hollywood Interfaith Food Pantry in Studio City serves walk-ups and drive-ups with no ID required. The farthest stop is a community fridge in Palmdale.'],
